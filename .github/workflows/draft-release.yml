name: Draft release

# Pushing a version to master that has no release yet drafts one with the
# version's CHANGELOG.md section. Publishing the draft creates the tag, which
# runs publish.yml.
on:
  push:
    branches:
      - "master"

permissions: {}

# Two quick pushes shouldn't both see the version as unreleased.
concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft a release for a new version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          # Drafts have their tag name before the tag exists.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists"
          elif gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' | grep -qxF "$tag"; then
            echo "$tag already has a draft release"
          else
            s/release-notes "$tag" > notes.md
            gh release create "$tag" --draft --target "$GITHUB_SHA" --notes-file notes.md --title "$tag"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
