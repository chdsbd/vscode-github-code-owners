name: Draft release

# Pushing a version to master that has no release yet builds a VSIX package
# for each platform, then drafts a release with them and the version's
# CHANGELOG.md section. The draft only appears with every package attached.
# Publishing it creates the tag and runs publish.yml, which publishes the
# draft's packages to the Marketplace.
on:
  push:
    branches:
      - "master"

permissions: {}

# Two quick pushes shouldn't both see the version as unreleased.
concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      # Only tokens that can push see draft releases.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          # Drafts have their tag name before the tag exists.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists"
          elif gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' | grep -qxF "$tag"; then
            echo "$tag already has a draft release"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  # Separate from drafting, so npm ci runs without write access.
  build:
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false
      - run: npm ci
      - run: s/package-all "$TAG" dist
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.vsix
          if-no-files-found: error
  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - run: |
          s/check-packages "$TAG" dist/*.vsix
          s/release-notes "$TAG" > notes.md
          assets() {
            gh api "repos/$GH_REPO/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .$1"
          }
          # A draft missing a package would block the next run, so delete it.
          if ! gh release create "$TAG" --draft --target "$GITHUB_SHA" --notes-file notes.md --title "$TAG" dist/*.vsix ||
            ! s/check-packages "$TAG" $(assets 'assets[].name'); then
            for id in $(assets id); do
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
            done
            exit 1
          fi
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
